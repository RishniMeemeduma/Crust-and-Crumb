<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crust and Crumb | Products</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="../js/components.js" defer></script>
</head>
<body>

<site-header></site-header>

<main id="main" tabindex="-1">
  <h1>Products</h1>

  <div class="products">
    <div class="product">
      <img src="pencil.jpg" alt="HB pencil">
      <h3>Pencil</h3>
      <p>An HB pencil for writing and drawing.</p>
      <p>£0.50</p>
      <button onclick="addToBasket('Pencil')">Add to basket</button>
    </div>

    <div class="product">
      <img src="pen.jpg" alt="Blue ballpoint pen">
      <h3>Pen</h3>
      <p>A blue ballpoint pen for everyday writing.</p>
      <p>£1.00</p>
      <button onclick="addToBasket('Pen')">Add to basket</button>
    </div>

    <div class="product">
      <img src="rubber.jpg" alt="White pencil rubber">
      <h3>Rubber</h3>
      <p>A small rubber for correcting pencil marks.</p>
      <p>£0.75</p>
      <button onclick="addToBasket('Rubber')">Add to basket</button>
    </div>
  </div>

  <h2>Basket</h2>
  <p id="basket">Your basket is empty.</p>
</main>

<site-footer></site-footer>

<script src="../js/script.js"></script>
</body>
</html>
